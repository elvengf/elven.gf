<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://elven.gf">
    <title>elven.gf</title>
    <link rel="stylesheet" href="font/hack.css" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="box bg-black" data-href="landing.html">
        <span class="link-text">enter the site by clicking here. some javascript is used.</span>
    </div>
    <script>
    // Make the .box clickable
    document.addEventListener('DOMContentLoaded', function() {
        var box = document.querySelector('.box');
        if (box) {
            box.style.cursor = 'pointer';
            box.addEventListener('click', function() {
                var href = box.getAttribute('data-href');
                if (href) {
                    window.location.href = href;
                }
            });
        }
    });
    </script>
</html>
