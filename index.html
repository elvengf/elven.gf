<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://elven.gf">
    <title>elven.gf</title>
    <link rel="stylesheet" href="font/hack.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="index">
    <div class="box bg-black centerbox" data-href="landing.html">
        <span class="link-text">enter the site by clicking here. some javascript is used.</span>
    </div>
    <script>
    // Make the .box clickable
    document.querySelectorAll('.box[data-href]').forEach(box => {
            box.style.cursor = "pointer";
            box.addEventListener('click', () => {
                window.location.href = box.getAttribute('data-href');
            });
        });
    </script>
</body>
</html>
